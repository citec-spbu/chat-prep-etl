[workspace]
name = "chat-prep-etl"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64"]
conda-pypi-map = { "conda-forge" = "conda_pypi_mapping.json" }

# --- 1. General ---
[dependencies]
python-dotenv = "*"
pyyaml = "*"
requests = "*"
pandas = "*"

# --- 2. ETL ---
[feature.etl.dependencies]
python = "3.11.*"
bs4 = "*"
lxml = "*"
emoji = "*"
pymorphy2 = "*"
python-socks = ">=2.8.1,<3"
loguru = ">=0.7.3,<0.8"


[feature.etl.pypi-dependencies]
natasha = ">=1.6.0, <2"
pymorphy2-dicts-ru = "*"
telethon = "*"
setuptools = "==69.5.1" 
qdrant-client = ">=1.18.0, <2"
fastembed = ">=0.8.0, <0.9"
fastapi = ">=0.136.1, <0.137"
uvicorn = ">=0.46.0, <0.47"




# --- 3.  FRONT  ---
[feature.front.dependencies]
python = "3.12.*"
fastapi = "*"
uvicorn = "*"
streamlit = "*"

[feature.front.pypi-dependencies]
python-multipart = "*"




# --- 4. LLM ---
[feature.llm.dependencies]
python = "3.12.*"
pytorch = "*"
fastapi = "*"
uvicorn = "*"
langchain-openai = "*"
bert_score = "*"
transformers = "*"
nltk = "*"
rouge-score = "*"     


# ------
[environments]
etl-env = ["etl"]
front-env = ["front"]
llm-env = ["llm"]

[pypi-dependencies]
qdrant-client = ">=1.18.0, <2"


[tasks]
# Сборка всех образов с динамическим чтением портов из config.yaml
build = { cmd = "python -c \"import yaml, os; c=yaml.safe_load(open('config/config.yaml')); os.environ['ETL_PORT']=str(c['etl']['port']); os.environ['FRONTEND_PORT']=str(c['frontend']['port']); os.environ['TESTING_SYSTEM_PORT']=str(c['testing_system']['port'])\" && docker compose build" }

# Остановка всей системы и очистка volumes
down = "docker compose down -v"

# Просмотр логов
logs = "docker compose logs -f"

# Запуск всей системы
up = { cmd = "python -c \"import yaml, os; c=yaml.safe_load(open('config/config.yaml')); os.environ['ETL_PORT']=str(c['etl']['port']); os.environ['FRONTEND_PORT']=str(c['frontend']['port']); os.environ['TESTING_SYSTEM_PORT']=str(c['testing_system']['port']); prof='--profile ollama' if c['testing_system']['assistants']['type']=='ollama' else ''; os.system(f'docker compose {prof} up -d')\"" }

# Поднять frontend
up-front = { cmd = "python -c \"import yaml, os; c=yaml.safe_load(open('config/config.yaml')); os.environ['ETL_PORT']=str(c['etl']['port']); os.environ['FRONTEND_PORT']=str(c['frontend']['port']); os.environ['TESTING_SYSTEM_PORT']=str(c['testing_system']['port'])\" && docker compose up -d frontend" }

#  Поднять  ETL + база 
up-etl = { cmd = "python -c \"import yaml, os; c=yaml.safe_load(open('config/config.yaml')); os.environ['ETL_PORT']=str(c['etl']['port']); os.environ['FRONTEND_PORT']=str(c['frontend']['port']); os.environ['TESTING_SYSTEM_PORT']=str(c['testing_system']['port'])\" && docker compose up -d etl-service qdrant" }

# Поднять  Тестовую систему
up-ts = { cmd = "python -c \"import yaml, os; c=yaml.safe_load(open('config/config.yaml')); os.environ['ETL_PORT']=str(c['etl']['port']); os.environ['FRONTEND_PORT']=str(c['frontend']['port']); os.environ['TESTING_SYSTEM_PORT']=str(c['testing_system']['port']); prof='--profile ollama' if c['testing_system']['assistants']['type']=='ollama' else ''; os.system(f'docker compose {prof} up -d testing-system')\"" }